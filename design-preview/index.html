"i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol></defs></svg>
<div class="layout"><aside class="sidebar" id="sidebar"><button class="iconbtn close-nav" aria-label="Закрыть меню" data-close-menu><svg><use href="#i-close"/></svg></button><div class="brand"><div class="monogram">НК</div><div><strong>Wedding</strong><small>Организация</small></div></div><nav class="nav" id="nav"></nav><div class="navfoot"><button id="theme"><svg><use href="#i-moon"/></svg><span>Тёмная тема</span></button><button data-section="Настройки"><svg><use href="#i-settings"/></svg>Настройки</button></div></aside><div class="overlay" id="overlay" data-close-menu></div><main class="main"><header class="top"><button class="iconbtn menu" id="menu" aria-label="Открыть меню" aria-expanded="false"><svg><use href="#i-menu"/></svg></button><h1>Никита и Кристина</h1><div class="top-actions"><button class="iconbtn" data-section="Поиск" aria-label="Поиск"><svg><use href="#i-search"/></svg></button><button class="iconbtn" data-section="Последние изменения" aria-label="Последние изменения"><svg><use href="#i-bell"/></svg></button></div></header>
<div class="content"><section class="hero"><div><div class="eyebrow">ПОДГОТОВКА К СВАДЬБЕ</div><h2>19 июня 2027</h2><p>Предварительная дата торжества</p><div class="hero-meta"><span><svg><use href="#i-pin"/></svg>Санкт-Петербург</span><span><svg><use href="#i-calendar"/></svg>17 июня · регистрация</span></div></div><button class="hero-link" data-section="Программа">Открыть программу →</button></section>
<section class="tiles" id="tiles" aria-label="Быстрые переходы"></section>
<div class="grid"><div class="stack"><section class="panel"><div class="panel-head"><h2>Сейчас важно</h2><button class="link" data-section="Задачи">Все задачи <svg><use href="#i-arrow"/></svg></button></div><div class="tasks" id="tasks"></div></section><section class="panel"><div class="panel-head"><h2>Программа</h2><button class="link" data-section="Программа">К плану <svg><use href="#i-arrow"/></svg></button></div><div class="days" id="days"></div><div id="events"></div></section></div><div class="stack"><section class="progress"><div class="progress-top"><span>Выполнено задач</span><strong id="percent">0%</strong></div><div class="track" role="progressbar" aria-label="Выполнено задач" aria-valuemin="0" aria-valuemax="100"><span id="bar"></span></div><p id="progress-text"></p></section><section class="panel"><div class="panel-head"><h2>Последние изменения</h2></div><div id="activity"></div></section></div></div><p class="demo-note">Интерактивный макет · демонстрационные данные</p></div></main></div>
<dialog class="dialog" id="dialog"><header><h2 id="dialog-title"></h2><button class="iconbtn" id="dialog-close" aria-label="Закрыть"><svg><use href="#i-close"/></svg></button></header><div id="dialog-content"></div></dialog><div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), icon=n=>`<svg aria-hidden="true"><use href="#i-${n}"/></svg>`, esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sections=[['Обзор','grid'],['Гости','users'],['Площадки','house'],['Программа','calendar'],['Задачи','task'],['Бюджет','money'],['Фотографии','photo']];
const tasks=[['Выбрать банкетную площадку','22 активные · 6 в архиве'],['Согласовать финальную дату','19 июня — приоритет'],['Обновить список гостей','Проверить состав'],['Получить сметы кейтеринга','Сравнить актуальные предложения']];let done=new Set(),day=19;try{done=new Set(JSON.parse(localStorage.getItem('wedding-demo-done')||'[]'))}catch{};
const programs={17:[['14:00','Регистрация','Марьино']],18:[],19:[['13:00','Встреча гостей','С шампанским'],['14:00','Торжество','Предварительное время']],20:[],21:[]};
let activity=[['users','Обновлён список гостей','Демонстрационная запись','Сегодня'],['photo','Добавлены фотографии','Усадьба Марьино','Вчера'],['house','Изменён рейтинг площадок','Демонстрационная запись','Вчера']];
$('#nav').innerHTML=sections.map(([n,i],k)=>`<button data-section="${n}" class="${k===0?'active':''}">${icon(i)}${n}</button>`).join('');
function render(){const finished=done.size+5,total=18,p=Math.round(finished/total*100);$('#percent').textContent=p+'%';$('#bar').style.width=p+'%';$('.track').setAttribute('aria-valuenow',p);$('#progress-text').textContent=`${finished} из ${total} задач выполнено`;
$('#tiles').innerHTML=[['Гости','users','90','Основной состав'],['Площадки','house','22','Активные варианты'],['Задачи','task',13-done.size,'Осталось выполнить'],['Бюджет','money','Не задан','План расходов']].map(([n,i,v,s])=>`<button class="tile" data-section="${n}"><span class="tile-head">${icon(i)}${n}</span><strong class="tile-value">${v}</strong><span class="tile-sub">${s}</span></button>`).join('');
$('#tasks').innerHTML=tasks.map(([n,s],i)=>`<div class="task ${i===0&&!done.has(i)?'featured':''} ${done.has(i)?'done':''}"><button class="check ${done.has(i)?'done':''}" data-check="${i}" aria-label="${done.has(i)?'Вернуть в работу':'Завершить'}: ${n}" aria-pressed="${done.has(i)}">${done.has(i)?icon('check'):''}</button><button class="task-info" data-task="${i}"><strong>${n}</strong><small>${s}</small></button>${icon('arrow')}</div>`).join('');
$('#days').innerHTML=[17,18,19,20,21].map((d,i)=>`<button class="day ${day===d?'selected':''}" data-day="${d}" aria-pressed="${day===d}"><strong>${d}</strong><small>${['чт','пт','сб','вс','пн'][i]}</small></button>`).join('');
$('#events').innerHTML=programs[day].length?programs[day].map(([t,n,s],i)=>`<button class="event" data-event="${i}"><time>${t}</time><span><strong>${n}</strong><small>${s}</small></span>${icon('arrow')}</button>`).join(''):'<p style="color:var(--muted);margin:12px 0">На этот день программа пока не составлена.</p>';
$('#activity').innerHTML=activity.slice(0,4).map(([i,n,s,t],k)=>`<button class="activity" data-activity="${k}"><span class="activity-icon">${icon(i)}</span><div><strong>${esc(n)}</strong><small>${esc(s)}</small></div><time>${esc(t)}</time></button>`).join('');}
function setMenu(open){$('#sidebar').classList.toggle('open',open);$('#overlay').classList.toggle('show',open);$('#menu').setAttribute('aria-expanded',String(open));document.body.style.overflow=open?'hidden':''}
function syncTheme(){const dark=document.documentElement.dataset.theme==='dark';$('#theme').innerHTML=icon(dark?'sun':'moon')+'<span>'+(dark?'Светлая тема':'Тёмная тема')+'</span>'}
$('#theme').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('wedding-demo-theme',next)}catch{}syncTheme()};syncTheme();$('#menu').onclick=()=>setMenu(true);
const dlg=$('#dialog');function show(title,html){setMenu(false);$('#dialog-title').textContent=title;$('#dialog-content').innerHTML=html;if(!dlg.open)dlg.showModal()}
$('#dialog-close').onclick=()=>dlg.close();dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});let timer;function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function openSection(name){if(name==='Обзор'){setMenu(false);window.scrollTo({top:0,behavior:'smooth'});return}if(name==='Поиск'){show(name,'<p>Найти раздел или задачу в макете.</p><input id="search" placeholder="Поиск" autocomplete="off"><div id="results"></div>');const input=$('#search');const update=()=>{$('#results').innerHTML=[...sections.map(([n])=>n),...tasks.map(t=>t[0])].filter(n=>n.toLowerCase().includes(input.value.toLowerCase())).map(n=>`<button class="result" data-section="${esc(n)}">${esc(n)} →</button>`).join('')};input.oninput=update;update();input.focus();return}
const previews={'Гости':[['Основной состав','90'],['Резерв','10'],['Подтвердили','0']],'Площадки':[['Александровский парк','Открыть карточку'],['К2','Открыть карточку'],['Усадьба Марьино','Открыть карточку']],'Задачи':tasks.map(([n],i)=>[n,done.has(i)?'Выполнено':'В работе']),'Программа':programs[day].map(([t,n])=>[n,t]),'Бюджет':[['План','Не задан'],['Согласовано','0 ₽'],['Оплачено','0 ₽']],'Фотографии':[['Усадьба Марьино','Галерея']],'Последние изменения':activity.map(([,n,s])=>[n,s]),'Настройки':[['Тема','Меняется в боковом меню']]};show(name,'<p>Предпросмотр раздела. Это макет главной, не рабочая база.</p>'+((previews[name]||[[name,'Демонстрационная запись']]).map(([n,v])=>`<div class="event"><strong>${esc(n)}</strong><small>${esc(v)}</small></div>`).join('')||'<p>Нет записей.</p>'))}
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-close-menu]');if(!el)return;if(el.hasAttribute('data-close-menu'))setMenu(false);if(el.dataset.section)openSection(el.dataset.section);if(el.dataset.day){day=Number(el.dataset.day);render()}if(el.dataset.check!==undefined){const i=Number(el.dataset.check);const was=done.has(i);was?done.delete(i):done.add(i);try{localStorage.setItem('wedding-demo-done',JSON.stringify([...done]))}catch{}activity.unshift(['task',was?'Задача возвращена в работу':'Задача завершена',tasks[i][0],'Сейчас']);render();toast(was?'Возвращено в работу':'Задача выполнена')}if(el.dataset.task!==undefined){const [n,s]=tasks[Number(el.dataset.task)];show(n,`<p>${esc(s)}</p><p>Статус: ${done.has(Number(el.dataset.task))?'выполнено':'в работе'}</p>`)}if(el.dataset.event!==undefined){const [t,n,s]=programs[day][Number(el.dataset.event)];show(n,`<p>${day} июня · ${t}</p><p>${esc(s)}</p>`)}if(el.dataset.activity!==undefined){const [,n,s,t]=activity[Number(el.dataset.activity)];show(n,`<p>${esc(s)} · ${esc(t)}</p>`)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});render();
</script></body></html>
