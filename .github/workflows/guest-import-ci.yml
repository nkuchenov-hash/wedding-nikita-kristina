name: Validate wedding guest Excel importer
on:
  push:
    paths:
      - 'tools/prepare-guest-import.py'
      - 'tests/test_guest_excel.py'
      - '.github/workflows/guest-import-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare local Excel parser
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Test group ambiguity duplicates and private output
        run: python -m unittest discover -s tests -p 'test_guest_excel.py' -v
