name: Extract original MVP card source (read only)
on:
  push:
    branches: [preview/extract-mvp-card-source]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original card masks, structure and motion
        run: |
          mkdir -p /tmp/mvp
          for f in site edge-fix botanical-patch botanical-v4 botanical-v5; do unzip -oq "mvp-site/$f.zip" -d /tmp/mvp; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('/tmp/mvp/index.html').read_text()
          c=Path('/tmp/mvp/style.css').read_text()
          for m in re.finditer(r'<clipPath\b[^>]*id="(?:estate|city)-shape"[^>]*>.*?</clipPath>',h,re.S):
              print('MASK_SOURCE',m.group(0))
          for m in re.finditer(r'<div\b[^>]*class="[^"]*photo-shell[^"]*"[^>]*>.*?</figure>',h,re.S):
              print('MARKUP_SOURCE',m.group(0))
          for m in re.finditer(r'[^{}]+\{[^{}]+\}',c):
              v=m.group(0)
              if re.search(r'photo-shell|photo-frame|frame-estate|frame-city',v):
                  print('CSS_SOURCE',v.strip())
          PY
