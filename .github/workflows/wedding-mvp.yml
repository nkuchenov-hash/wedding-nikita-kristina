name: Publish isolated wedding MVP
on:
  push:
    branches: [main]
    paths:
      - 'mvp-site/**'
      - '.github/workflows/wedding-mvp.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wedding-mvp-only
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack the exact approved HTML package
        shell: bash
        run: |
          set -euo pipefail
          echo '122a50eaaad8597e9e0c51a7fcdcd54ab5a21d05e71ca022a29d29992224a8a1  mvp-site/site.zip' | sha256sum -c -
          mkdir -p _mvp
          unzip -q mvp-site/site.zip -d _mvp
          echo 'fffe9e59a23cf677a5010f798562072bcf46e9dcafe18c693a55800153aeb99d  mvp-site/edge-fix.zip' | sha256sum -c -
          unzip -oq mvp-site/edge-fix.zip -d _mvp
          echo '589554acc14a77f976776283bf1687c38d2e0859784bb957849fc113d9fcd508  mvp-site/botanical-patch.zip' | sha256sum -c -
          unzip -oq mvp-site/botanical-patch.zip -d _mvp
          echo '79e659a1a173e0990f85f2f2a29bd9a2d3fedfd140b752d7c81f2f0132172c83  mvp-site/botanical-v4.zip' | sha256sum -c -
          unzip -oq mvp-site/botanical-v4.zip -d _mvp
          echo '3fe83bf818572ae4116d6b667ed8cc0b97255e3df1b30ce006fd3fdf1c045094  mvp-site/botanical-v5.zip' | sha256sum -c -
          unzip -oq mvp-site/botanical-v5.zip -d _mvp
          test -s _mvp/index.html
          node --check _mvp/script.js
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          for name in ['couple','birch-right','ladybird','strawberry','skyline','bridge','flowers-left','flowers-right','birch-top-left','hero-lower-left','welcome-left','welcome-right','welcome-small-left','program-right','sprig']:
              b=Path('_mvp/assets/'+name+'.png').read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n'
              assert b[25] in (4,6) or b'tRNS' in b, name+' must have alpha transparency'
          css=Path('_mvp/style.css')
          styles=css.read_text()
          assert '@media not (pointer:coarse)' in styles or '@media(hover:hover) and (pointer:fine)' in styles
          css.write_text(styles.replace('@media(hover:hover) and (pointer:fine)','@media not (pointer:coarse)'))
          p=Path('_mvp/index.html')
          html=p.read_text()
          assert html.count('data-photo-slot=')==6
          assert html.count('<article class="day">')==3
          assert html.count('<figure class="photo-frame')==2
          assert '<h1>Никита' in html
          assert 'class="hero-ladybird' not in html, 'No floating ladybird'
          assert html.count('class="hero-birch ornament"')==1
          assert html.count('class="hero-leaves ornament"')==1
          assert not re.search(r'assets/(day-.*base|title-.*|mobile-portrait|hero-background)\.png',html)
          rev=os.environ['GITHUB_SHA'][:12]
          html=re.sub(r'(src|href)="(assets/[^"]+|style\.css|script\.js)"',lambda m:f'{m[1]}="{m[2]}?v={rev}"',html)
          p.write_text(html)
          print('INDEPENDENT_HTML_COMPONENTS_AND_ALPHA_ASSETS_OK')
          PY
          printf '{"revision":"%s","mode":"separate-mvp"}\n' "${GITHUB_SHA:0:12}" > _mvp/version.json
      - name: Browser test desktop and mobile before deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wedding-mvp-qa
          cd /tmp/wedding-mvp-qa
          npm install --no-save --no-package-lock puppeteer-core@24
          python3 -m http.server 4178 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/_mvp" >/tmp/mvp-http.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" || true' EXIT
          cat > check.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import assert from 'node:assert/strict';
          import {existsSync,mkdirSync} from 'node:fs';
          const chrome=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(existsSync);
          assert.ok(chrome,'Chrome not available');
          const b=await puppeteer.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          mkdirSync(process.env.GITHUB_WORKSPACE+'/_mvp-qa',{recursive:true});
          try {
            for(const [name,width,height] of [['reference-scale',941,900],['desktop',1600,950],['mobile',390,844]]){
              const p=await b.newPage();
              await p.setViewport({width,height,deviceScaleFactor:1});
              await p.goto('http://127.0.0.1:4178/',{waitUntil:'domcontentloaded',timeout:30000});
              const report=await p.evaluate(async()=>{
                await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
                return {bad:[...document.images].filter(i=>!i.naturalWidth).map(i=>i.src),overflow:document.documentElement.scrollWidth>innerWidth};
              });
              assert.deepEqual(report.bad,[]);
              assert.equal(report.overflow,false);
              assert.equal(await p.evaluate(sel=>document.querySelectorAll(sel).length,'.day'),3);
              assert.equal(await p.evaluate(sel=>document.querySelectorAll(sel).length,'img[data-photo-slot]'),6);
              assert.equal(await p.evaluate(sel=>document.querySelectorAll(sel).length,'.day-copy h3'),3);
              assert.equal(await p.evaluate(()=>document.querySelectorAll('.hero > img.hero-couple,.hero > img.hero-bg,.hero > img.hero-skyline').length),3);
              if(name==='reference-scale')assert.ok(Math.abs(await p.evaluate(()=>document.querySelector('.page').getBoundingClientRect().height)-1672)<2);
              await p.evaluate(()=>Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,3000))]));
              await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/_mvp-qa/'+name+'.png',fullPage:true});
              assert.equal(await p.evaluate(()=>document.querySelectorAll('.day-shell').length),3);
              if(name==='desktop'){
                await p.evaluate(()=>{document.documentElement.style.scrollBehavior='auto';document.querySelector('.day-shell').scrollIntoView({behavior:'instant',block:'center'});});
                await new Promise(r=>setTimeout(r,250));
                const box=await (await p.$('.day-shell')).boundingBox();
                await p.mouse.move(box.x+box.width/2,box.y+box.height/2);
                await new Promise(r=>setTimeout(r,900));
                const motion=await p.$eval('.day-shell',e=>({lift:new DOMMatrix(getComputedStyle(e).transform).m42,zoom:new DOMMatrix(getComputedStyle(e.querySelector('.day-photo img')).transform).a,shadow:getComputedStyle(e).filter,hover:e.matches(':hover'),media:matchMedia('(hover:hover) and (pointer:fine)').matches}));
                console.log('CARD_HOVER',JSON.stringify(motion));
                assert.ok(motion.lift < -3 && motion.zoom > 1.01 && motion.shadow.includes('drop-shadow'));
                await p.screenshot({path:process.env.GITHUB_WORKSPACE+'/_mvp-qa/hover.png'});
                await p.mouse.move(0,0);
              }
              await p.$eval('.hero-cta',b=>b.click());
              assert.equal(await p.$eval('dialog',d=>d.open),true);
              await p.$eval('.close',b=>b.click());
              await p.evaluate(()=>weddingMvp.replacePhoto('day-17',document.querySelector('[data-photo-slot=day-19]').src));
              assert.equal(await p.$eval('[data-photo-slot=day-17]',i=>i.src),await p.$eval('[data-photo-slot=day-19]',i=>i.src));
              assert.equal(await p.$eval('.day h3',e=>e.textContent),'17 июня');
              await p.close();
              console.log('BROWSER_TEST_OK',name);
            }
          }finally{await b.close()}
          JS
          node check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wedding-mvp-rendered-screens
          path: _mvp-qa
      - name: Deploy only /mvp and verify existing pages are untouched
        shell: bash
        env:
          HOST: ${{ secrets.WEDDING_SFTP_HOST }}
          USERNAME: ${{ secrets.WEDDING_SFTP_USER }}
          SSH_KEY: ${{ secrets.WEDDING_SFTP_SSH_KEY }}
          HOST_KEYS: ${{ secrets.WEDDING_SFTP_KNOWN_HOSTS }}
          DESTINATION: ${{ secrets.WEDDING_SFTP_PATH }}
          PORT: ${{ secrets.WEDDING_SFTP_PORT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$SSH_KEY" && test -n "$HOST_KEYS" && test -n "$DESTINATION"
          [[ "$DESTINATION" == /var/www/* ]]
          [[ "$DESTINATION" != "/" ]]
          [[ -n "$PORT" ]] || PORT=22
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/wedding_deploy_key"
          printf '%s\n' "$HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/wedding_deploy_key" "$HOME/.ssh/known_hosts"
          SSH_OPTS="-4 -i $HOME/.ssh/wedding_deploy_key -p $PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          before=$(ssh $SSH_OPTS "$USERNAME@$HOST" "sha256sum '$DESTINATION/index.html' '$DESTINATION/preview/index.html' '$DESTINATION/admin/index.php'")
          ssh $SSH_OPTS "$USERNAME@$HOST" "mkdir -p '$DESTINATION/mvp'"
          rsync --archive --delete --no-perms --omit-dir-times --timeout=120 --rsh "ssh $SSH_OPTS" _mvp/ "$USERNAME@$HOST:$DESTINATION/mvp/"
          after=$(ssh $SSH_OPTS "$USERNAME@$HOST" "sha256sum '$DESTINATION/index.html' '$DESTINATION/preview/index.html' '$DESTINATION/admin/index.php'")
          test "$before" = "$after"
          echo CURRENT_SITE_UNCHANGED
          local_sha=$(sha256sum _mvp/index.html | awk '{print $1}')
          remote_sha=$(ssh $SSH_OPTS "$USERNAME@$HOST" "sha256sum '$DESTINATION/mvp/index.html'" | awk '{print $1}')
          test "$local_sha" = "$remote_sha"
          echo MVP_UPLOADED
      - name: Verify exact online version and PNGs
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://nikitakristina.ru/mvp
          curl -fsSL --retry 3 --max-time 20 "$BASE/version.json?v=${GITHUB_SHA:0:12}" | grep -Fq "\"revision\":\"${GITHUB_SHA:0:12}\""
          curl -fsSL --retry 3 --max-time 20 "$BASE/index.html?v=${GITHUB_SHA:0:12}" -o /tmp/mvp-live.html
          cmp /tmp/mvp-live.html _mvp/index.html
          for asset in couple birch-right birch-top-left hero-lower-left welcome-left welcome-right welcome-small-left program-right flowers-left flowers-right sprig ladybird strawberry bridge skyline forest; do
            curl -fsSL --retry 3 --max-time 20 "$BASE/assets/$asset.png?v=${GITHUB_SHA:0:12}" -o /tmp/mvp-live.png
            cmp /tmp/mvp-live.png "_mvp/assets/$asset.png"
          done
          echo ONLINE_MVP_VERIFIED
