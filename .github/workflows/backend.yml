name: Install private wedding database backend
on:
  push:
    paths:
      - 'backend/**'
      - 'tools/export-wedding-venues.mjs'
      - 'src/venues.js'
      - 'src/venues-data.js'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wedding-backend
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backend files and private entry point
        shell: bash
        run: |
          set -euo pipefail
          test -s backend/schema.sql
          test -s backend/bin/migrate.php
          test -s backend/src/core.php
          test -s backend/src/api.php
          test -s backend/public/index.php
          test ! -f backend/wedding-config.json
          test ! -f backend/wedding.sqlite3
      - name: Prepare verified venue catalog seed
        shell: bash
        run: |
          node tools/export-wedding-venues.mjs
          test -s backend/seed/venues.json
      - name: Install on REG.RU outside document root
        timeout-minutes: 4
        shell: bash
        env:
          HOST: ${{ secrets.WEDDING_SFTP_HOST }}
          USERNAME: ${{ secrets.WEDDING_SFTP_USER }}
          SSH_KEY: ${{ secrets.WEDDING_SFTP_SSH_KEY }}
          HOST_KEYS: ${{ secrets.WEDDING_SFTP_KNOWN_HOSTS }}
          PORT: ${{ secrets.WEDDING_SFTP_PORT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$SSH_KEY" && test -n "$HOST_KEYS"
          : "${PORT:=22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/wedding_backend_key"
          printf '%s\n' "$HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/wedding_backend_key" "$HOME/.ssh/known_hosts"
          SSH_OPTS="-4 -i $HOME/.ssh/wedding_backend_key -p $PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          PRIVATE="/var/www/u3728035/data/wedding-private"
          ssh $SSH_OPTS "$USERNAME@$HOST" "umask 077; mkdir -p '$PRIVATE/backend'"
          rsync --archive --delete --no-perms --omit-dir-times --timeout=90 \
            --rsh "ssh $SSH_OPTS" \
            backend/ "$USERNAME@$HOST:$PRIVATE/backend/"
          ssh $SSH_OPTS "$USERNAME@$HOST" "
            set -eu
            cd '$PRIVATE/backend'
            for phpfile in src/*.php bin/*.php public/*.php; do
              php -l \"\$phpfile\" >/dev/null || exit 1
            done
            php bin/smoke.php
            php bin/test-guest-progress.php
            if test -f '$PRIVATE/wedding.sqlite3'; then php bin/backup.php; fi
            php bin/migrate.php
            php bin/seed-venues.php
            php bin/import-venue-files.php
            php bin/seed-planning.php
            php bin/backfill-couple-relation.php
            php bin/smoke.php
            test -f '$PRIVATE/wedding.sqlite3'
            test -f '$PRIVATE/wedding-config.json'
            php bin/status.php
          "
