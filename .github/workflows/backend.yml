name: Install private wedding database backend
on:
  push:
    paths:
      - 'backend/**'
      - 'tools/export-wedding-venues.mjs'
      - 'src/venues.js'
      - 'src/venues-data.js'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wedding-backend
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backend files and private entry point
        shell: bash
        run: |
          set -euo pipefail
          test -s backend/schema.sql
          test -s backend/bin/migrate.php
          test -s backend/src/core.php
          test -s backend/src/api.php
          test -s backend/public/index.php
          test ! -f backend/wedding-config.json
          test ! -f backend/wedding.sqlite3
      - name: Prepare verified venue catalog seed
        shell: bash
        run: |
          node tools/export-wedding-venues.mjs
          test -s backend/seed/venues.json
          test -s backend/seed/venue-dates.json
      - name: Verify every PHP file before touching live backend
        shell: bash
        run: |
          set -euo pipefail
          for phpfile in backend/src/*.php backend/bin/*.php backend/public/*.php; do
            php -l "$phpfile"
          done
          php backend/bin/smoke.php
          php backend/bin/test-guest-progress.php
          node --test test/kristina-ideas.test.mjs
      - name: Install on REG.RU outside document root
        timeout-minutes: 4
        shell: bash
        env:
          HOST: ${{ secrets.WEDDING_SFTP_HOST }}
          USERNAME: ${{ secrets.WEDDING_SFTP_USER }}
          SSH_KEY: ${{ secrets.WEDDING_SFTP_SSH_KEY }}
          HOST_KEYS: ${{ secrets.WEDDING_SFTP_KNOWN_HOSTS }}
          PORT: ${{ secrets.WEDDING_SFTP_PORT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$SSH_KEY" && test -n "$HOST_KEYS"
          : "${PORT:=22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/wedding_backend_key"
          printf '%s\n' "$HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/wedding_backend_key" "$HOME/.ssh/known_hosts"
          SSH_OPTS="-4 -i $HOME/.ssh/wedding_backend_key -p $PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          PRIVATE="/var/www/u3728035/data/wedding-private"
          SHORT_SHA=$(printf '%.12s' "$GITHUB_SHA")
          RELEASE="$PRIVATE/backend-release-$SHORT_SHA"
          ssh $SSH_OPTS "$USERNAME@$HOST" "set -eu; umask 077; mkdir -p '$RELEASE'"
          # Upload into an inactive release; incomplete transfers never touch live PHP.
          rsync --archive --delete --no-perms --omit-dir-times --timeout=90 \
            --rsh "ssh $SSH_OPTS" \
            backend/ "$USERNAME@$HOST:$RELEASE/"
          ssh $SSH_OPTS "$USERNAME@$HOST" "
            set -eu
            cd '$RELEASE'
            # Validate exact transferred PHP bytes before replacing any working API.
            for phpfile in src/*.php bin/*.php public/*.php; do
              php -l \"\$phpfile\" >/dev/null
            done
            php bin/smoke.php
            php bin/test-guest-progress.php
            if test -f '$PRIVATE/wedding.sqlite3'; then php bin/backup.php; fi
            # Idempotent migrations and seed while the previous API is still live.
            php bin/migrate.php
            php bin/migrate-rating-rules-20261123.php
            php bin/backfill-guest-profiles.php
            php bin/backfill-guest-children.php
            php bin/backfill-guest-locations.php
            php bin/backfill-guest-country-relations.php
            php bin/test-unified-guests.php
            php bin/seed-venues.php
            php bin/seed-venue-dates.php
            php bin/sync-santa-gloria-offer-20261123.php
            php bin/sync-alexandrovsky-rider-20261123.php
            php bin/sync-working-budget-sources-20261123.php
            php bin/remove-invalid-chadu-20261123.php
            php bin/apply-venue-confirmations-20261118.php
            php bin/supplement-telegram-20261118.php
            php bin/reconcile-palma-pricing-20261118.php
             php bin/apply-venue-updates-20261123.php
            php bin/import-venue-files.php
            php bin/seed-planning.php
            php bin/import-kristina-ideas-20261120.php
            php bin/backfill-couple-relation.php
            php bin/smoke.php
            test -f '$PRIVATE/wedding.sqlite3'
            test -f '$PRIVATE/wedding-config.json'
            php bin/status.php
            # Only a verified release can become the active PHP backend.
            NEXT='$PRIVATE/backend-next-$SHORT_SHA'
            ln -s '$RELEASE' \"\$NEXT\"
            if test -L '$PRIVATE/backend'; then
              mv -Tf \"\$NEXT\" '$PRIVATE/backend'
            else
              LEGACY='$PRIVATE/backend-legacy-$SHORT_SHA'
              mv '$PRIVATE/backend' \"\$LEGACY\"
              if ! mv -T \"\$NEXT\" '$PRIVATE/backend'; then
                mv \"\$LEGACY\" '$PRIVATE/backend'
                exit 1
              fi
            fi
            test -f '$PRIVATE/backend/src/api.php'
            php -l '$PRIVATE/backend/src/api.php'
            echo BACKEND_VERIFIED_RELEASE_ACTIVE
          "
