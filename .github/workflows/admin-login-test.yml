name: Verify real wedding admin login
on:
  workflow_run:
    workflows: ['Install private wedding database backend', 'Publish admin-only wedding site']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Run full HTTPS login with disposable test account
        timeout-minutes: 3
        shell: bash
        env:
          HOST: ${{ secrets.WEDDING_SFTP_HOST }}
          USERNAME: ${{ secrets.WEDDING_SFTP_USER }}
          SSH_KEY: ${{ secrets.WEDDING_SFTP_SSH_KEY }}
          HOST_KEYS: ${{ secrets.WEDDING_SFTP_KNOWN_HOSTS }}
          PORT: ${{ secrets.WEDDING_SFTP_PORT }}
        run: |
          set -euo pipefail
          : "${PORT:=22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/probe_key
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/probe_key ~/.ssh/known_hosts
          SSH_OPTS="-4 -i $HOME/.ssh/probe_key -p $PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          remote="$USERNAME@$HOST"
          passfile='/var/www/u3728035/data/wedding-private/.htpasswd'
          probe_user="probe$(openssl rand -hex 5)"
          probe_pw="$(openssl rand -hex 24)"
          probe_hash="$(php -r 'echo password_hash($argv[1], PASSWORD_BCRYPT);' "$probe_pw")"
          cleanup() {
            ssh $SSH_OPTS "$remote" "sed -i '/^$probe_user:/d' '$passfile'; chmod 600 '$passfile'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s:%s\n' "$probe_user" "$probe_hash" | \
            ssh $SSH_OPTS "$remote" "umask 077; cat >> '$passfile'"
          jar=$(mktemp)
          # The shared host issues its own first-request browser cookie challenge.
          curl --fail --silent --show-error --max-time 15 -c "$jar" -b "$jar" \
            -o /tmp/challenge.html https://nikitakristina.ru/admin/
          curl --fail --silent --show-error --max-time 15 -c "$jar" -b "$jar" \
            -o /tmp/login-page.html 'https://nikitakristina.ru/admin/?attempt=1'
          grep -Fq 'name="csrf"' /tmp/login-page.html
          echo 'LOGIN_FORM_VISIBLE'
          csrf=$(sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p' /tmp/login-page.html | head -1)
          test -n "$csrf"
          # A mobile tab may be stale after PHP session garbage collection.
          # The page refreshes its CSRF token immediately before submitting.
          curl --fail --silent --show-error --max-time 15 -c "$jar" -b "$jar" \
            -o /tmp/login-csrf-refresh.json \
            'https://nikitakristina.ru/admin/?refresh_login_csrf=1'
          csrf=$(python3 -c 'import json; v=json.load(open("/tmp/login-csrf-refresh.json")); assert v.get("ok") is True; t=v.get("csrf",""); assert len(t)==48 and all(c in "0123456789abcdef" for c in t); print(t)')
          echo 'LOGIN_CSRF_REFRESH_OK'
          code=$(curl --silent --show-error --max-time 15 -c "$jar" -b "$jar" \
            -o /tmp/login-response.html -D /tmp/login-headers.txt -w '%{http_code}' \
            --data-urlencode "login=1" \
            --data-urlencode "csrf=$csrf" \
            --data-urlencode "username=$probe_user" \
            --data-urlencode "password=$probe_pw" \
            'https://nikitakristina.ru/admin/')
          echo "LOGIN_POST_HTTP=$code"
          test "$code" = 303
          page_code=$(curl --silent --show-error --max-time 15 -c "$jar" -b "$jar" \
            -o /tmp/admin-page.html -w '%{http_code}' https://nikitakristina.ru/admin/)
          echo "AUTHENTICATED_ADMIN_HTTP=$page_code"
          test "$page_code" = 200
          grep -Fq 'index.php?asset=src/admin-app.js' /tmp/admin-page.html
          asset_code=$(curl --silent --show-error --max-time 15 -c "$jar" -b "$jar" \
            -o /tmp/admin-app.js -w '%{http_code}' \
            'https://nikitakristina.ru/admin/index.php?asset=src/admin-app.js')
          echo "AUTHENTICATED_JS_HTTP=$asset_code"
          test "$asset_code" = 200
          grep -Fq 'activateAdminData' /tmp/admin-app.js
          echo 'ADMIN_END_TO_END_LOGIN_PASSED'
          if grep -Fq 'id="admin-menu-toggle"' /tmp/admin-app.js; then
            curl --fail --silent --show-error --max-time 15 -b "$jar" 'https://nikitakristina.ru/admin/index.php?asset=src/admin-heading.css' -o /tmp/admin-responsive.css
            grep -Fq 'data-mobile-nav-open' /tmp/admin-responsive.css
            grep -Fq 'ad-gb-mobile-person' /tmp/admin-responsive.css
            grep -Fq 'vw-mobile-filter-label' /tmp/admin-responsive.css
            echo 'LIVE_MOBILE_ADMIN_LAYOUT_CONFIRMED'
          fi
          if grep -Fq 'wedding-admin-theme' /tmp/admin-app.js; then
            ! grep -Fq 'id="login-theme"' /tmp/login-page.html
            grep -Fq 'name="color-scheme" content="light dark"' /tmp/login-page.html
            grep -Fq 'prefers-color-scheme: dark' /tmp/login-page.html
            grep -Fq 'id="login-auto-theme"' /tmp/login-page.html
            grep -Fq 'data-login-night' /tmp/login-page.html
            grep -Fq 'h>=20||h<7' /tmp/login-page.html
            grep -Fq 'id="admin-theme-toggle"' /tmp/admin-app.js
            grep -Fq 'wedding-admin-theme' /tmp/admin-page.html
            for css in styles.css admin-heading.css admin-guests.css admin-program.css admin-data.css admin-photos.css venues.css venue-detail-ui.css venue-files-ui.css; do
              curl --fail --silent --show-error --max-time 15 -b "$jar" "https://nikitakristina.ru/admin/index.php?asset=src/$css" -o "/tmp/theme-$css"
              grep -Fq -- '--admin-dark-' "/tmp/theme-$css"
            done
            grep -Fq 'html[data-admin-theme="dark"]' /tmp/theme-admin-heading.css
            echo 'LIVE_ADMIN_AND_LOGIN_DARK_THEME_CONFIRMED'
          fi
          curl --fail --silent --show-error --max-time 15 -b "$jar" -c "$jar" \
            'https://nikitakristina.ru/admin/index.php?api=admin%2Frecords&collection=venues' \
            -o /tmp/wedding-venues.json
          python3 -c 'import json; v=json.load(open("/tmp/wedding-venues.json")); assert v.get("ok") and len(v.get("items",[]))>=25; print("VENUES_API_OK")'

          curl --fail --silent --show-error --max-time 15 -b "$jar" -c "$jar" \
            'https://nikitakristina.ru/admin/index.php?api=admin%2Fvenue-files' \
            -o /tmp/wedding-document-inventory.json
          python3 -c 'import json;v=json.load(open("/tmp/wedding-document-inventory.json"));f=v.get("files",[]);assert v.get("ok") and len(f)>=52 and sum(x["type"]=="video" for x in f)==7;print("VENUE_DOCUMENT_ARCHIVE_OK",len(f))'
          curl --fail --silent --show-error --max-time 15 -b "$jar" -c "$jar" \
            'https://nikitakristina.ru/admin/index.php?api=admin%2Fguests' \
            -o /tmp/wedding-guests.json
          python3 -c 'import json;v=json.load(open("/tmp/wedding-guests.json"));g=v.get("guests",[]);assert v.get("ok") and len(g)>=114 and "source_person_id" in g[0];print("PRIVATE_GUEST_PROFILES_OK",len(g))'

          for asset in admin-guests.js venue-files-ui.js venue-detail-ui.js admin-photos.js venue-transcript-costs.js venue-budget-coverage.js venues.js venue-evaluation.js venues-data.js; do
            code=$(curl --fail --silent --show-error --max-time 15 -b "$jar" -c "$jar" -o "/tmp/$asset" \
              -w '%{http_code}' "https://nikitakristina.ru/admin/index.php?asset=src/$asset")
            test "$code" = 200
            test -s "/tmp/$asset"
          done
          grep -Fq 'activateGuestDirectory' /tmp/admin-guests.js
          grep -Fq 'childrenEnabled' /tmp/admin-guests.js
          grep -Fq "'reserve','Резерв'" /tmp/admin-guests.js
          grep -Fq 'SORT_FIELDS' /tmp/admin-guests.js
          grep -Fq 'admin/guests/revision' /tmp/admin-guests.js
          grep -Fq 'invitation_sent_at' /tmp/admin-guests.js
          grep -Fq 'hydrateVenueFiles' /tmp/venue-files-ui.js
          grep -Fq 'transcriptAddonTotal' /tmp/venue-transcript-costs.js
          grep -Fq 'venueBudgetCoverage' /tmp/venue-budget-coverage.js
          grep -Fq 'data-venue-files' /tmp/venue-detail-ui.js
          grep -Fq 'data-rating-fact' /tmp/venue-detail-ui.js
          grep -Fq 'data-rating-open' /tmp/venues.js
          grep -Fq 'venue_rating_rules' /tmp/venues.js
          grep -Fq 'Презентабельность и удобство входа' /tmp/venue-evaluation.js
          grep -Fq '"entrance": "no"' /tmp/venues-data.js
          echo 'LIVE_ENTRANCE_CRITERION_AND_VESENNIY_CONFIRMED'
          # Verify the latest authenticated live assets, not only repository sources.
          grep -Fq 'vdp-rating-inputs' /tmp/venue-detail-ui.js
          grep -Fq 'vdp-terms-page' /tmp/venue-detail-ui.js
          grep -Fq 'summarizeVenueBudget' /tmp/venue-evaluation.js
          grep -Fq 'budgetSummary' /tmp/venues.js
          curl --fail --silent --show-error --max-time 15 -b "$jar" -c "$jar" \
            'https://nikitakristina.ru/admin/index.php?asset=src/venues.css' \
            -o /tmp/venues-layout.css
          grep -Fq '.vw-page.vw-control-board .vw-date-edit>span{' /tmp/venues-layout.css
          python3 - <<'PY'
          import json
          source=open('/tmp/venues-data.js',encoding='utf-8').read()
          records=json.loads(source.split('export const VENUE_RECORDS = ',1)[1].strip().rstrip(';'))
          assert records['alex-park']['capacity']==300
          assert records['eva']['capacity']==150
          assert records['vesenniy']['capacity'] is None
          assert records['vinity']['capacity'] is None
          print('LIVE_VENUE_CAPACITY_SOURCE_VERIFIED')
          for row in json.load(open('/tmp/wedding-venues.json'))['items']:
              data=json.loads(row.get('details_json') or '{}')
              ident=data.get('wedding_comparison_id') or (data.get('public') or {}).get('id') or row.get('id')
              if ident in ('alex-park','eva','vesenniy','vinity'):
                  overrides=data.get('overrides') or {}
                  print('LIVE_CAPACITY_OVERRIDE',ident,overrides.get('capacity','UNSET'))
          PY
          echo 'LIVE_VENUE_UNIFIED_CARD_AND_DATE_LAYOUT_VERIFIED'

          curl --fail --silent --show-error --max-time 15 -b "$jar" -c "$jar" \
            'https://nikitakristina.ru/admin/index.php?api=admin%2Fsettings' \
            -o /tmp/wedding-ranking-settings.json
          python3 -c 'import json; d=json.load(open("/tmp/wedding-ranking-settings.json")); assert d.get("ok") and isinstance(d.get("settings"),dict); print("VENUE_RATING_SETTINGS_API_OK")'
          curl --fail --silent --show-error --max-time 15 -b "$jar" -c "$jar" \
            'https://nikitakristina.ru/admin/index.php?api=admin%2Fvenue-files&venue_id=vinity' \
            -o /tmp/wedding-vinity-files.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/wedding-vinity-files.json'))
          assert data.get('ok'), 'Venue files endpoint failed'
          files=data.get('files',[])
          assert files, 'Vinity has no attached files in database'
          assert all(f.get('venue_id')=='vinity' for f in files), 'Wrong venue documents included'
          print('VENUE_CARD_DOCUMENTS_OK',len(files))
          PY
          grep -Fq 'activatePhotoArchive' /tmp/admin-photos.js
          echo 'ADMIN_ALL_ARCHIVE_INTERFACES_ACCESSIBLE'

          curl --fail --silent --show-error --max-time 15 -b "$jar" -c "$jar" \
            'https://nikitakristina.ru/admin/index.php?api=admin%2Foverview' \
            -o /tmp/wedding-guest-funnel.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/wedding-guest-funnel.json'))
          assert data['ok'], 'Overview is not available'
          guest=data['guests']
          for key in ('total','prepared','sent','opened','registered','responded','confirmed','declined','tentative','public_visible'):
              assert key in guest, 'Missing dashboard field '+key
              assert int(guest[key])>=0
          assert int(guest['total']) >= 0
          assert int(guest['reserved'])>=0
          assert isinstance(guest['children_enabled'],bool)
          rows=json.load(open('/tmp/wedding-guests.json'))['guests']
          assert int(guest['children_total'])==sum(g.get('status')!='archived' and g.get('age_group') in ('child','infant') for g in rows)
          assert int(guest['confirmed'])<=int(guest['registered'])
          assert int(guest['public_visible'])<=int(guest['confirmed'])
          assert int(guest['confirmed'])<=int(guest['responded'])
          assert isinstance(data.get('recent_activity'), list)
          print('GUEST_LIFECYCLE_DASHBOARD_OK')
          PY
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/wedding-guests.json'))
          guests=data['guests']
          assert len(guests)>=114
          assert data.get('children_enabled') in (True,False)
          assert isinstance(data.get('revision'),int)
          assert sum(g.get('age_group') in ('child','infant') for g in guests)>=12
          assert all(g.get('planning_status') in ('main','reserve') for g in guests)
          sample=guests[0]
          for key in ('active_invite_id','invite_prepared_at','invitation_sent_at',
                     'first_opened_at','profile_completed_at','attendance'):
              assert key in sample, 'Missing guest stage '+key
          print('INDIVIDUAL_GUEST_PROGRESS_OK')

          relation_count=sum(bool(g.get('relation_to_couple')) for g in guests)
          assert relation_count>=35, ('Couple relations not backfilled',relation_count)
          for key in ('relation_to_couple','relationship','name_en','seating_group','response_source','dietary_notes','planning_status','age_group'):
              assert key in sample, 'Missing editable guest field '+key
          print('COUPLE_RELATIONS_AND_GUEST_FIELDS_OK',relation_count)
          PY

          # Verify the real live SQLite values without changing any records.
          curl --fail --silent --show-error --max-time 15 -b "$jar" -c "$jar" \
            'https://nikitakristina.ru/admin/index.php?api=admin%2Fvenue-dates' \
            -o /tmp/wedding-venue-dates-live.json
          python3 - <<'PY'
          import json
          payload=json.load(open('/tmp/wedding-venue-dates-live.json'))
          assert payload.get('ok') is True
          actual={(v['venue_id'],v['day']):v['status'] for v in payload.get('dates',[])}
          for venue,day in [('eva','18'),('eva','20'),('putilov','20'),
                            ('harmony','18'),('harmony','19'),('harmony','20')]:
              assert actual.get((venue,'2027-06-'+day))=='available', (venue,day,actual.get((venue,'2027-06-'+day)))
          print('LIVE_VENUE_DATES_CONFIRMED',6)
          data=json.load(open('/tmp/wedding-venues.json'))
          matches=[]
          for row in data.get('items',[]):
              detail=json.loads(row.get('details_json') or '{}')
              venue_id=detail.get('wedding_comparison_id') or (detail.get('public') or {}).get('id')
              if venue_id=='harmony':
                  matches.append(detail.get('overrides') or {})
          assert any(v.get('cost',{}).get('rent')==170000
                     and v.get('cost',{}).get('menu')==5500
                     and any(q.get('total')==764000 and q.get('kind')=='estimate'
                             for q in v.get('quotes',[])) for v in matches), matches
          print('LIVE_HARMONY_OFFER_CONFIRMED')
          PY
