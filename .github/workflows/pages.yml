name: Publish admin-only wedding site
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/prepare-admin-release.mjs'
      - 'tools/admin-dark-theme.mjs'
      - 'tools/stage-guest-online.mjs'
      - 'tools/admin-gateway.php'
      - '.github/workflows/pages.yml'
      - 'tests/**'
      - 'test/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wedding-admin-recovery-20261120-final
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static code and prepared admin
        timeout-minutes: 3
        run: |
          # A single syntax error in any imported module blanks the entire admin.
          # Verify the full protected ESM entrypoint chain before deployment.
          for asset in src/admin-app.js src/admin-data-ui.js src/admin-settings.js src/admin-program.js src/admin-photos.js src/admin-guests.js src/venues.js src/venue-detail-ui.js src/venue-files-ui.js src/venue-evaluation.js src/venues-pricing.js; do
            node --check "$asset"
          done
          npm run check
          node --check src/admin-app.js
          node --check src/admin-data-ui.js
          node --check src/admin-program.js
          node --check src/admin-guests.js
          node --check src/venue-files-ui.js
          node --check src/admin-photos.js
          php -l tools/admin-gateway.php
      - name: Build only private administrative assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/src _site/public
          cp src/admin-app.js src/admin-toast.js src/admin-data-ui.js src/admin-data.css src/admin-program.js src/admin-program.css src/admin-settings.js src/admin-photos.js src/admin-photos.css src/venue-files-ui.js src/venue-files-ui.css src/admin-guests.js src/admin-guests.css src/admin-heading.css src/data.js src/styles.css \
             src/venues.js src/venues-data.js src/venues.css \
             src/venue-detail-ui.js src/venue-detail-ui.css src/venues-pricing.js src/venue-evaluation.js \
             src/venue-transcript-costs.js src/venue-budget-coverage.js \
             src/venues-photos-1.js src/venues-photos-2.js src/venues-photos-3.js src/venues-photos-4.js src/venues-photos-5.js _site/src/
          cp public/mark.svg _site/public/
          touch _site/.nojekyll
          node -e 'const fs=require("fs");fs.writeFileSync("_site/build-info.json",JSON.stringify({revision:process.env.GITHUB_SHA.slice(0,12),builtAt:new Date().toISOString()})+"\n")'
      - name: Stage protected admin and neutral homepage
        shell: bash
        run: |
          set -euo pipefail
          node tools/prepare-admin-release.mjs
          test -s _site/admin/index.php
          test -s _admin-private/index.html
          test -s _admin-private/src/admin-data-ui.js
          # Regression gate: organisers must never see the removed duplicate
          # identity panel, the child quota, or the transport questions.
          ! grep -Fq 'advanced.append(advancedFields)' _admin-private/src/admin-guests.js
          ! grep -Fq 'Разрешено детей с этим гостем' _admin-private/src/admin-guests.js
          ! grep -Fq 'Нужен трансфер' _admin-private/src/admin-guests.js
          grep -Fq 'checkRelease' _admin-private/src/admin-app.js
          test -s _admin-private/src/venue-transcript-costs.js
          test -s _admin-private/src/venue-budget-coverage.js
          test -s _admin-private/src/venues-photos-5.js
          grep -Fq 'index.php?asset=src/venues-photos-5.js' _admin-private/src/venue-detail-ui.js
          grep -Fq 'index.php?asset=src/venue-transcript-costs.js' _admin-private/src/venues.js
          grep -Fq 'index.php?asset=src/venue-budget-coverage.js' _admin-private/src/venue-evaluation.js
          ! grep -Fq 'Демо-панель:' _admin-private/src/admin-app.js
          ! grep -Fq 'ДЕМО · БЕЗ БАЗЫ ДАННЫХ' _admin-private/src/admin-app.js
          ! grep -Fq 'Пока без серверной авторизации' _admin-private/src/venue-detail-ui.js
          test ! -e _site/admin/src
          test ! -e _site/src/app.js
          test ! -e _site/public/photos
          grep -Fq 'Сайт готовится' _site/index.html
          grep -Fq 'password_verify' _site/admin/index.php
          grep -Fq 'id="login-theme"' _site/admin/index.php
          grep -Fq 'wedding-admin-theme' _admin-private/index.html
          grep -Fq 'html[data-admin-theme="dark"]' _admin-private/src/admin-heading.css
      - name: Stage guest browser preview at /preview with no private admin sources
        shell: bash
        run: |
          set -euo pipefail
          node tools/stage-guest-online.mjs
          test -s _site/preview/index.html
          test -s _pages/preview/index.html
          test -s _site/preview/src/guest-online-entry.js
          test ! -e _site/preview/src/admin-app.js
          test ! -e _site/preview/backend
          grep -Fq 'src/guest-online-entry.js' _pages/preview/index.html
      - name: Package website for purchased hosting
        uses: actions/upload-artifact@v4
        with:
          name: wedding-hosting-ready
          path: _site/
          if-no-files-found: error
          retention-days: 14
      - name: Deploy to REG.RU via SSH (backed up and verified)
        timeout-minutes: 5
        shell: bash
        env:
          HOST: ${{ secrets.WEDDING_SFTP_HOST }}
          USERNAME: ${{ secrets.WEDDING_SFTP_USER }}
          SSH_KEY: ${{ secrets.WEDDING_SFTP_SSH_KEY }}
          HOST_KEYS: ${{ secrets.WEDDING_SFTP_KNOWN_HOSTS }}
          DESTINATION: ${{ secrets.WEDDING_SFTP_PATH }}
          PORT: ${{ secrets.WEDDING_SFTP_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "$HOST" || -z "$USERNAME" || -z "$SSH_KEY" || -z "$HOST_KEYS" || -z "$DESTINATION" ]]; then
            echo "::error::REG.RU deployment is not configured. Check WEDDING_SFTP_* Actions secrets."
            exit 1
          fi
          if [[ "$DESTINATION" != /var/www/* || "$DESTINATION" == "/" || "$DESTINATION" == "." ]]; then
            echo "::error::Invalid deployment destination."
            exit 1
          fi
          if [[ -z "$PORT" ]]; then PORT=22; fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/wedding_deploy_key"
          printf '%s\n' "$HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/wedding_deploy_key" "$HOME/.ssh/known_hosts"
          SSH_OPTS="-4 -i $HOME/.ssh/wedding_deploy_key -p $PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=20 -o ServerAliveCountMax=2"
          # Never replace the organizer password file during website releases.
          # Only an explicit credential-management action may rotate access.
          ssh $SSH_OPTS "$USERNAME@$HOST" "set -eu; umask 077; test -s /var/www/u3728035/data/wedding-private/.htpasswd; chmod 600 /var/www/u3728035/data/wedding-private/.htpasswd"
          # The hosting account already contains a landing page; keep a recoverable copy
          # outside of the public document root before the very first replacement.
          ssh $SSH_OPTS "$USERNAME@$HOST" \
            "set -eu; test -d '$DESTINATION'; mkdir -p ~/wedding-backups; if test -f '$DESTINATION/index.html' && ! test -e ~/wedding-backups/index-before-github.html; then cp -p '$DESTINATION/index.html' ~/wedding-backups/index-before-github.html; fi"
          # First upload the private authenticated asset bundle outside public webroot.
          ssh $SSH_OPTS "$USERNAME@$HOST" 'mkdir -p /var/www/u3728035/data/wedding-private/admin-release'
          rsync --archive --no-perms --omit-dir-times --timeout=120 \
            --rsh "ssh $SSH_OPTS" \
            _admin-private/ "$USERNAME@$HOST:/var/www/u3728035/data/wedding-private/admin-release/"
          # Site originally contained only index.html and files deployed from this workflow.
          # Remove the guest bundle while preserving Let's Encrypt challenges and backup.
          rsync --archive --verbose --delete --exclude='/.well-known/' --no-perms --omit-dir-times --timeout=120 \
            --rsh "ssh $SSH_OPTS" \
            _site/ "$USERNAME@$HOST:$DESTINATION/"
          local_sha=$(sha256sum _site/index.html | awk '{print $1}')
          remote_sha=$(ssh $SSH_OPTS "$USERNAME@$HOST" "sha256sum '$DESTINATION/index.html'" | awk '{print $1}')
          if [[ "$local_sha" != "$remote_sha" ]]; then
            echo "::error::REG.RU index.html checksum mismatch after upload."
            exit 1
          fi
          admin_sha=$(sha256sum _site/admin/index.php | awk '{print $1}')
          remote_admin_sha=$(ssh $SSH_OPTS "$USERNAME@$HOST" "sha256sum '$DESTINATION/admin/index.php'" | awk '{print $1}')
          if [[ "$admin_sha" != "$remote_admin_sha" ]]; then
            echo "::error::REG.RU admin/index.php checksum mismatch."
            exit 1
          fi
          for asset in admin-app.js admin-data-ui.js admin-guests.js admin-guests.css admin-photos.js venue-files-ui.js venue-detail-ui.js venue-transcript-costs.js venue-budget-coverage.js venues-photos-5.js venue-evaluation.js venues-data.js; do
            local_asset_sha=$(sha256sum "_admin-private/src/$asset" | awk '{print $1}')
            remote_asset_sha=$(ssh $SSH_OPTS "$USERNAME@$HOST" "sha256sum '/var/www/u3728035/data/wedding-private/admin-release/src/$asset'" | awk '{print $1}')
            if [[ "$local_asset_sha" != "$remote_asset_sha" ]]; then
              echo "::error::REG.RU protected admin asset mismatch: $asset"
              exit 1
            fi
          done
          preview_sha=$(sha256sum _site/preview/index.html | awk '{print $1}')
          remote_preview_sha=$(ssh $SSH_OPTS "$USERNAME@$HOST" "sha256sum '$DESTINATION/preview/index.html'" | awk '{print $1}')
          if [[ "$preview_sha" != "$remote_preview_sha" ]]; then
            echo "::error::REG.RU preview index checksum mismatch."
            exit 1
          fi
          echo "Guest browser preview uploaded to REG.RU at /preview/."
          # Inspect the actual private files installed at the production path.
          # A successful GitHub commit is NOT sufficient release evidence.
          ssh $SSH_OPTS "$USERNAME@$HOST" \
            "set -eu; ! grep -Fq 'advanced.append(advancedFields)' /var/www/u3728035/data/wedding-private/admin-release/src/admin-guests.js; \
             ! grep -Fq 'Разрешено детей с этим гостем' /var/www/u3728035/data/wedding-private/admin-release/src/admin-guests.js; \
             ! grep -Fq 'Нужен трансфер' /var/www/u3728035/data/wedding-private/admin-release/src/admin-guests.js; \
             grep -Fq 'checkRelease' /var/www/u3728035/data/wedding-private/admin-release/src/admin-app.js"
          remote_version=$(ssh $SSH_OPTS "$USERNAME@$HOST" "cat '$DESTINATION/build-info.json'")
          echo "$remote_version" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const v=JSON.parse(s); if(v.revision!==process.env.GITHUB_SHA.slice(0,12))process.exit(1)})'
          # Check the actual private production release, not just a new build number.
          ssh $SSH_OPTS "$USERNAME@$HOST" \
            "set -eu; grep -Fq 'Презентабельность и удобство входа' /var/www/u3728035/data/wedding-private/admin-release/src/venue-evaluation.js; \
             grep -Fq '\"entrance\": \"no\"' /var/www/u3728035/data/wedding-private/admin-release/src/venues-data.js"
          echo "REG.RU protected admin JavaScript bundle matches this release."
          echo "REG.RU admin-only deployment confirmed by remote checksums."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Pages is in maintenance mode
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nkuchenov-hash.github.io/wedding-nikita-kristina"
          VERSION="${GITHUB_SHA:0:12}"
          for i in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 15 --output /tmp/wedding-pages-build.json "$BASE/build-info.json?revision=$VERSION" &&
               node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync("/tmp/wedding-pages-build.json","utf8")); process.exit(v.revision===process.argv[1]?0:1)' "$VERSION" &&
               curl --fail --silent --show-error --max-time 15 --output /tmp/wedding-pages-index.html "$BASE/index.html?revision=$VERSION" &&
               grep -Fq 'Сайт готовится' /tmp/wedding-pages-index.html; then
              echo "Pages now serves maintenance only; guest invitation unpublished."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Pages maintenance not yet verified."
          exit 1
