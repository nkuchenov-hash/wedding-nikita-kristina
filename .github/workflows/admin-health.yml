name: Check wedding admin availability and authentication
on:
  push:
    paths:
      - .github/workflows/admin-health.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check REG.RU HTTPS, maintenance and protected admin
        shell: bash
        run: |
          set -euo pipefail
          root='https://nikitakristina.ru/'
          admin='https://nikitakristina.ru/admin/'
          for i in 1 2 3 4 5; do
            home_status=$(curl --insecure --silent --show-error --max-time 15 \
              --resolve 'nikitakristina.ru:443:31.31.196.24' \
              --output /tmp/guest-maintenance.html \
              --write-out '%{http_code}' "$root") || home_status=ERR
            admin_status=$(curl --insecure --silent --show-error --max-time 15 \
              --resolve 'nikitakristina.ru:443:31.31.196.24' \
              --output /tmp/admin-unauthorized.html \
              --write-out '%{http_code}' "$admin") || admin_status=ERR
            echo "Origin attempt $i: public root=$home_status, unauthenticated admin=$admin_status"
            if [[ "$admin_status" == "200" ]]; then
              echo "UNEXPECTED ADMIN 200 BODY PREVIEW:"
              head -c 280 /tmp/admin-unauthorized.html | tr '\n' ' '
              echo
              curl --insecure --silent --show-error --max-time 15 \\
                --resolve 'nikitakristina.ru:443:31.31.196.24' \\
                --output /tmp/admin-direct.html \\
                --write-out 'Direct PHP route status: %{http_code}; content type: %{content_type}\\n' \\
                'https://nikitakristina.ru/admin/index.php'
              head -c 220 /tmp/admin-direct.html | tr '\n' ' '
              echo
              exit 1
            fi
            if [[ "$home_status" == 200 && "$admin_status" == 401 ]] && \
               grep -Fq 'Сайт готовится' /tmp/guest-maintenance.html; then
              echo 'PASS: guest invite held and admin requires a password. TLS trust is checked separately.'
              exit 0
            fi
            sleep 5
          done
          echo '::error::REG.RU origin did not show expected 200 maintenance and 401 admin protection.'
          exit 1
