name: Encrypted private guest snapshot for one-sheet reconciliation
on:
  push:
    paths:
      - 'backend/bin/export-guests-json.php'
      - 'tools/guest-export-public-cert.pem'
      - '.github/workflows/guest-export-encrypted.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wedding-guest-export
  cancel-in-progress: false
jobs:
  read_only_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only exporter
        run: php -l backend/bin/export-guests-json.php
      - name: Read live private SQLite and emit ONLY CMS-encrypted snapshot
        shell: bash
        env:
          HOST: ${{ secrets.WEDDING_SFTP_HOST }}
          USERNAME: ${{ secrets.WEDDING_SFTP_USER }}
          SSH_KEY: ${{ secrets.WEDDING_SFTP_SSH_KEY }}
          HOST_KEYS: ${{ secrets.WEDDING_SFTP_KNOWN_HOSTS }}
          PORT: ${{ secrets.WEDDING_SFTP_PORT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$SSH_KEY" && test -n "$HOST_KEYS"
          : "${PORT:=22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/wedding_guest_export"
          printf '%s\n' "$HOST_KEYS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/wedding_guest_export" "$HOME/.ssh/known_hosts"
          SSH_OPTS="-4 -i $HOME/.ssh/wedding_guest_export -p $PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=2"
          ROOT=/var/www/u3728035/data/wedding-private
          ssh $SSH_OPTS "$USERNAME@$HOST" "set -eu; umask 077; mkdir -p '$ROOT/imports'; test -s '$ROOT/backend/src/core.php'"
          scp -4 -i "$HOME/.ssh/wedding_guest_export" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            backend/bin/export-guests-json.php \
            "$USERNAME@$HOST:$ROOT/backend/bin/export-guests-json.php"
          scp -4 -i "$HOME/.ssh/wedding_guest_export" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            tools/guest-export-public-cert.pem \
            "$USERNAME@$HOST:$ROOT/imports/guest-export-public-cert.pem"
          ssh $SSH_OPTS "$USERNAME@$HOST" 'bash -se' > "$RUNNER_TEMP/guest-snapshot-encrypted.cms" <<'REMOTE'
          set -euo pipefail
          umask 077
          ROOT=/var/www/u3728035/data/wedding-private
          cert="$ROOT/imports/guest-export-public-cert.pem"
          test_xlsx="$ROOT/imports/guest-xlsx-smoke.xlsx"
          trap 'rm -f "$cert" "$test_xlsx"' EXIT
          test -s "$cert"
          php -l "$ROOT/backend/bin/export-guests-json.php" 1>&2
          php "$ROOT/backend/bin/export-guests-json.php" |
            gzip -c |
            openssl smime -encrypt -binary -aes-256-cbc -outform DER "$cert"
          php -l "$ROOT/backend/src/guest-xlsx-export.php" >&2
          php -r 'require $argv[1];require $argv[2];\Wedding\streamLiveGuestXlsx(\Wedding\db());'             "$ROOT/backend/src/core.php" "$ROOT/backend/src/guest-xlsx-export.php" > "$test_xlsx"
          php -r '$z=new ZipArchive();if($z->open($argv[1])!==true)exit(2);if($z->locateName("xl/worksheets/sheet1.xml")===false)exit(3);if($z->numFiles<6)exit(4);$z->close();'             "$test_xlsx"
          echo "LIVE_GUEST_XLSX_OK" >&2
          REMOTE
          test -s "$RUNNER_TEMP/guest-snapshot-encrypted.cms"
          echo "Encrypted private guest snapshot ready (no personal data in logs)"
      - name: Upload encrypted snapshot as short-lived private artifact
        uses: actions/upload-artifact@v4
        with:
          name: guest-snapshot-encrypted
          path: ${{ runner.temp }}/guest-snapshot-encrypted.cms
          retention-days: 1
          if-no-files-found: error
